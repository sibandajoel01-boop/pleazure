        specs: ['Desensitizing formula', 'Pleasant flavor', 'Easy dispensing'] }

    /* ---------- Code below does the work. No need to edit. ---------- */
    const imgUrl = f => IMG_FOLDER + encodeURIComponent(f);
    const money = n => CURRENCY + Number(n).toFixed(2);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const hideBroken = img => { img.onerror = () => { img.style.visibility = 'hidden'; }; };

    const grid = document.getElementById('productGrid');
    products.forEach((p, i) => {
      const card = document.createElement('article');
      card.className = 'product-card';
      card.innerHTML =
        '<div class="image-wrapper"><img src="' + imgUrl(p.images[0]) + '" alt="' + esc(p.name) + '" loading="lazy"></div>' +
        '<div class="product-info"><h3>' + esc(p.name) + '</h3><p>' + esc(p.desc) + '</p></div>' +
        '<div class="product-meta"><span class="price">' + money(p.price) + '</span><button class="view-btn">View</button></div>';
      hideBroken(card.querySelector('img'));
      card.addEventListener('click', () => openModal(i));
      grid.appendChild(card);
    });

    const modal = document.getElementById('productModal');
    const mImage = document.getElementById('mImage');
    const mThumbs = document.getElementById('mThumbs');

    function openModal(i) {
      const p = products[i];
      document.getElementById('mTitle').textContent = p.name;
      document.getElementById('mPrice').textContent = money(p.price);
      document.getElementById('mDesc').textContent = p.desc;
      document.getElementById('mSpecs').innerHTML = p.specs.map(s => '<li>✓ ' + esc(s) + '</li>').join('');

      const show = f => { mImage.style.visibility = 'visible'; mImage.src = imgUrl(f); mImage.alt = p.name; };
      hideBroken(mImage);
      show(p.images[0]);

      mThumbs.innerHTML = '';
      if (p.images.length > 1) {
        p.images.forEach((f, n) => {
          const b = document.createElement('button');
          b.innerHTML = '<img src="' + imgUrl(f) + '" alt="">';
          if (n === 0) b.className = 'on';
          b.addEventListener('click', () => {
            mThumbs.querySelectorAll('button').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            show(f);
          });
          mThumbs.appendChild(b);
        });
      }
      modal.classList.add('active');
    }

    function closeModal() { modal.classList.remove('active'); }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
