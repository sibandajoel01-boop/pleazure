          b.className = 'arr ' + cls; b.textContent = ch; b.setAttribute('aria-label', dir < 0 ? 'Previous image' : 'Next image');

    const grid = $('productGrid');
    products.forEach((p, i) => {
      const card = document.createElement('article');
      card.className = 'product-card';
      card.appendChild(buildSlider(p, true));
      card.insertAdjacentHTML('beforeend',
        '<div class="product-info"><h3>' + esc(p.name) + '</h3><p>' + esc(p.desc) + '</p></div>' +
        '<div class="product-meta"><span class="price">' + money(p.price) + '</span><button class="add-btn">Add</button></div>');
      card.querySelector('.add-btn').addEventListener('click', e => { e.stopPropagation(); addToCart(i); });
      card.addEventListener('click', () => openModal(i));
      grid.appendChild(card);
    });

    /* Product popup */
    const modal = $('productModal');
    let current = 0;
    function openModal(i) {
      current = i;
      const p = products[i];
      $('mMedia').innerHTML = '';
      $('mMedia').appendChild(buildSlider(p, false));
      $('mTitle').textContent = p.name;
      $('mPrice').textContent = money(p.price);
      $('mDesc').textContent = p.desc;
      $('mSpecs').innerHTML = p.specs.map(s => '<li>✓ ' + esc(s) + '</li>').join('');
      modal.classList.add('active');
      document.body.classList.add('lock');
    }
    function closeModal() { modal.classList.remove('active'); if (!$('drawer').classList.contains('open')) document.body.classList.remove('lock'); }
    $('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    $('mAdd').addEventListener('click', () => { addToCart(current); closeModal(); });

    /* Cart */
    let cart = {};
    try { cart = JSON.parse(localStorage.getItem('pleazure_cart')) || {}; } catch (e) {}
    const saveCart = () => { try { localStorage.setItem('pleazure_cart', JSON.stringify(cart)); } catch (e) {} };

    function addToCart(i) {
      cart[i] = (cart[i] || 0) + 1;
      saveCart(); renderCart(); toast('Added to cart');
    }
    function changeQty(i, d) {
      cart[i] = (cart[i] || 0) + d;
      if (cart[i] <= 0) delete cart[i];
      saveCart(); renderCart();
    }
    function renderCart() {
      const ids = Object.keys(cart).filter(i => products[i]);
      const count = ids.reduce((n, i) => n + cart[i], 0);
      const total = ids.reduce((n, i) => n + cart[i] * products[i].price, 0);
      $('cartCount').textContent = count;
      $('cartTotal').textContent = money(total);
      $('checkoutBtn').disabled = !count;
      $('cartItems').innerHTML = ids.length ? ids.map(i => {
        const p = products[i];
        return '<div class="c-item"><div class="c-img"><img src="' + imgUrl(p.images[0]) + '" alt=""></div>' +
          '<div class="c-info"><div class="c-name">' + esc(p.name) + '</div><div class="c-price">' + money(p.price) + '</div>' +
          '<div class="qty"><button data-i="' + i + '" data-d="-1" aria-label="Less">−</button><span>' + cart[i] + '</span><button data-i="' + i + '" data-d="1" aria-label="More">+</button></div></div>' +
          '<button class="c-rm" data-i="' + i + '" data-d="remove">Remove</button></div>';
      }).join('') : '<div class="empty">Your cart is empty</div>';
    }
    $('cartItems').addEventListener('click', e => {
      const b = e.target.closest('button[data-i]'); if (!b) return;
      const i = b.dataset.i;
      if (b.dataset.d === 'remove') { delete cart[i]; saveCart(); renderCart(); }
      else changeQty(i, Number(b.dataset.d));
    });

    function openCart() { $('drawer').classList.add('open'); $('scrim').classList.add('active'); document.body.classList.add('lock'); }
    function closeCart() { $('drawer').classList.remove('open'); $('scrim').classList.remove('active'); document.body.classList.remove('lock'); }
    $('openCart').addEventListener('click', openCart);
    $('closeCart').addEventListener('click', closeCart);
    $('scrim').addEventListener('click', closeCart);
    $('checkoutBtn').addEventListener('click', () => alert('Checkout is coming soon.'));

    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeCart(); } });

    let tt;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1600);
    }

    renderCart();
  </script>
</body>
</html>
