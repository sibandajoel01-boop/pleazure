<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLEAZURE.ONLINE</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      width: 100%;
      box-sizing: border-box;
      border-bottom: 1px solid #222;
      background-color: #000;
    }
    .brand-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      color: #fff;
    }
    .nav-actions {
      display: flex;
      align-items: center;
    }
    .cart-bag-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      position: relative;
      padding: 4px;
    }
    .cart-count {
      position: absolute;
      top: -2px;
      right: -6px;
      background: #e50914;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="/" class="brand-logo">PLEAZURE.ONLINE</a>
    <div class="nav-actions">
      <button class="cart-bag-btn" aria-label="Shopping Bag">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-count">0</span>
      </button>
    </div>
  </header>

</body>
</html>
